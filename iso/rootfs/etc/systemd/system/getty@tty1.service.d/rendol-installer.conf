# Только в live-системе, установщик удаляет этот файл.
[Unit]
After=console-setup.service
Wants=console-setup.service

[Service]
ExecStart=
ExecStart=-/usr/local/sbin/rendol-installer
StandardInput=tty
StandardOutput=tty
TTYPath=/dev/tty1
TTYReset=yes
TTYVHangup=yes
Restart=always
Environment=TERM=linux
