# Переменные проекта: GITHUB_TOKEN, VCK_URL, VCK_TOKEN, VC_REGISTRY_USER,
# VC_REGISTRY_PASSWORD, VC_REGISTRY_CA (File), RN_GOPROXY, RN_NPM_REGISTRY,
# RN_APT_MIRROR, VCK_CA_FILE (File, если у VCK внутренний сертификат).
# Задания test:bpf и сборки требуют раннер с privileged = true.

variables:
  GITHUB_REPO:     "github.com/RageDisplay/RendolNet"
  GITHUB_REF:      "main"
  REGISTRY_HOST:   "cloud.vectrix.sec:5000"
  IMAGE_BASE:      "cloud.vectrix.sec:5000/rendolnet"
  SKOPEO_IMAGE:    "quay.io/skopeo/stable:v1.16.1"
  DOCKER_BUILDKIT: "1"

  COMPONENTS: "api agent zapret"
  VCK_PROJECT: "rendolnet"

  GO_IMAGE:        "golang:1.26.8"
  NODE_IMAGE:      "node:22-alpine"
  ALPINE_IMAGE:    "alpine:3.21"
  PG_IMAGE:        "postgres:17-alpine"
  GOLANGCI_VERSION: "v2.9.0"

  GO_TEST_PARALLEL:     "2"
  GOLANGCI_CONCURRENCY: "2"
  GO_CACHE_DIR: "$CI_PROJECT_DIR/.gocache"

stages:
  - fetch
  - test
  - build
  - scan
  - publish
  - package

# == 1. Исходники ==============================================================
fetch:source:
  stage: fetch
  image:
    name: alpine/git:latest
    entrypoint: [""]
  variables:
    GIT_STRATEGY: none
  script:
    - git clone --branch "$GITHUB_REF" "https://x-access-token:${GITHUB_TOKEN}@${GITHUB_REPO}" src
    - echo "SRC_SHA=$(git -C src rev-parse --short HEAD)" >> build.env
    - echo "SRC_REF_SLUG=$(echo "$GITHUB_REF" | tr '/' '-')" >> build.env
    - |
      DESC="$(git -C src describe --tags --match 'v[0-9]*.[0-9]*.[0-9]*' --abbrev=7 2>/dev/null || true)"
      if [ -n "$DESC" ]; then
        SRC_VERSION="${DESC#v}"
      else
        SRC_VERSION="0.0.0-$(git -C src rev-list --count HEAD)-g$(git -C src rev-parse --short=7 HEAD)"
      fi
      echo "SRC_VERSION=$SRC_VERSION" >> build.env
    - cat build.env
    - rm -rf src/.git
    - chmod -R a+rwX src
  artifacts:
    paths: [src]
    expire_in: 1 day
    reports:
      dotenv: build.env

# == 2. Тесты ==================================================================
.go_job: &go_job
  image: $GO_IMAGE
  variables:
    GIT_STRATEGY: none
    GOPATH: "$GO_CACHE_DIR"
    GOMODCACHE: "$GO_CACHE_DIR/pkg/mod"
    GOCACHE: "$GO_CACHE_DIR/build"
    GOFLAGS: "-buildvcs=false"
    GOTOOLCHAIN: local
  before_script:
    - if [ -n "$RN_GOPROXY" ]; then export GOPROXY="$RN_GOPROXY"; fi
    - go env GOPROXY GOMODCACHE GOCACHE

test:go:
  <<: *go_job
  stage: test
  needs: ["fetch:source"]
  cache:
    - key: gomod
      paths: [.gocache/pkg/mod]
    - key: "gobuild-$CI_JOB_NAME"
      paths: [.gocache/build]
  script:
    - mkdir -p reports
    - cd src
    - go mod download && go mod verify
    - |
      unformatted=$(gofmt -s -l ./cmd ./internal ./tools)
      if [ -n "$unformatted" ]; then
        echo "Не отформатированы:"; echo "$unformatted"; exit 1
      fi
    - |
      before=$(sha256sum go.mod go.sum)
      go mod tidy || { echo "go mod tidy завершился ошибкой"; exit 1; }
      [ "$before" = "$(sha256sum go.mod go.sum)" ] || { echo "go.mod/go.sum не приведены в порядок: go mod tidy"; exit 1; }
    - |
      set -o pipefail
      go test ./... -race -count=1 -p "$GO_TEST_PARALLEL" -coverprofile="$CI_PROJECT_DIR/reports/coverage.out" 2>&1 | tee "$CI_PROJECT_DIR/reports/go-test.txt"
    - '[ -s "$CI_PROJECT_DIR/reports/coverage.out" ] && go tool cover -func="$CI_PROJECT_DIR/reports/coverage.out" | tail -1'
    - mkdir -p "$CI_PROJECT_DIR/bin"
    - CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -X main.version=$SRC_VERSION" -o "$CI_PROJECT_DIR/bin/" ./cmd/...
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/, bin/]

# Сквозные тесты API на Postgres.
test:api:
  <<: *go_job
  stage: test
  needs: ["fetch:source"]
  services:
    - name: $PG_IMAGE
      alias: pg
  variables:
    GIT_STRATEGY: none
    GOPATH: "$GO_CACHE_DIR"
    GOMODCACHE: "$GO_CACHE_DIR/pkg/mod"
    GOCACHE: "$GO_CACHE_DIR/build"
    GOTOOLCHAIN: local
    POSTGRES_PASSWORD: pg
    POSTGRES_DB: rn
    RN_TEST_DATABASE_URL: "postgres://postgres:pg@pg:5432/rn"
  cache:
    - key: gomod
      paths: [.gocache/pkg/mod]
      policy: pull
  script:
    - cd src
    - set -o pipefail; go test ./internal/api/ -count=1 -v 2>&1 | grep -E '^(---|ok|FAIL|PASS)'

# eBPF-программы в ядре раннера (BPF_PROG_TEST_RUN), плюс проверка,
# что сгенерированные *_bpfel.* совпадают с исходником bpf/rendol.c.
test:bpf:
  stage: test
  image: docker:27
  services: ["docker:27-dind"]
  needs: ["fetch:source"]
  variables:
    GIT_STRATEGY: none
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - cd src
    - docker build -q --build-arg GO_IMAGE="$GO_IMAGE" --build-arg APT_MIRROR="${RN_APT_MIRROR:-}" -f build/Dockerfile.bpf -t rn-bpf build
    - |
      docker run --rm --privileged -e RN_BPF_TEST=1 -e GOPROXY="${RN_GOPROXY:-https://proxy.golang.org,direct}" \
        -v "$PWD:/src" -w /src rn-bpf sh -c '
          set -e
          sha256sum internal/dataplane/ebpf/rendol_bpfel.go > /tmp/before
          go generate ./internal/dataplane/ebpf/
          sha256sum -c --quiet /tmp/before || { echo "bpf/rendol.c изменён, а обвязка не перегенерирована: make bpf"; exit 1; }
          go test -count=1 -v ./internal/dataplane/ ./internal/dhcpd/ ./internal/agent/ > /tmp/t.txt 2>&1 || { cat /tmp/t.txt; exit 1; }
          grep -E "^(---|ok)" /tmp/t.txt'

test:lint:
  <<: *go_job
  stage: test
  needs: ["fetch:source"]
  cache:
    - key: gomod-lint
      paths: [.gocache/pkg/mod]
    - key: "gobuild-$CI_JOB_NAME"
      paths: [.gocache/build]
  script:
    - cd src
    - go run github.com/golangci/golangci-lint/v2/cmd/golangci-lint@$GOLANGCI_VERSION run --config build/golangci.yml --timeout 8m --concurrency "$GOLANGCI_CONCURRENCY"

test:web:
  stage: test
  image: $NODE_IMAGE
  needs: ["fetch:source"]
  variables:
    GIT_STRATEGY: none
    npm_config_cache: "$CI_PROJECT_DIR/.npmcache"
  cache:
    key: npm
    paths: [.npmcache]
  script:
    - cd src/web
    - npm ci --no-audit --no-fund --registry="${RN_NPM_REGISTRY:-https://registry.npmjs.org/}"
    - npm run build
    - ls -lh dist/assets

test:shell:
  stage: test
  image: koalaman/shellcheck-alpine:v0.10.0
  needs: ["fetch:source"]
  variables:
    GIT_STRATEGY: none
  script:
    - cd src
    - shellcheck -x scripts/*.sh iso/*.sh deploy/dev/*.sh

test:manifests:
  stage: test
  image: python:3.12-alpine
  needs: ["fetch:source"]
  variables:
    GIT_STRATEGY: none
  script:
    - apk add --no-cache bash sed >/dev/null
    - pip install --quiet pyyaml
    - cd src
    - bash scripts/render-manifests.sh "$SRC_VERSION" > /tmp/m.yaml
    - python -c "import yaml; d=[x for x in yaml.safe_load_all(open('/tmp/m.yaml')) if x]; print(len(d), 'объектов:', ', '.join(x['kind']+'/'+x['metadata']['name'] for x in d))"
    - python -c "import yaml; yaml.safe_load(open('.gitlab-ci.yml'))"

# == 3. Образы =================================================================
.build_image:
  stage: build
  image: docker:27
  services: ["docker:27-dind"]
  needs: ["fetch:source", "test:go", "test:api", "test:bpf", "test:lint", "test:web", "test:shell", "test:manifests"]
  variables:
    GIT_STRATEGY: none
    DOCKER_TLS_CERTDIR: "/certs"
  script:
    - IMG="$IMAGE_BASE/$COMPONENT"
    - cd src
    - |
      docker build --pull -f deploy/Dockerfile --target "$COMPONENT" \
        --build-arg VERSION="$SRC_VERSION" \
        --build-arg GOPROXY="${RN_GOPROXY:-}" \
        --build-arg NPM_REGISTRY="${RN_NPM_REGISTRY:-}" \
        --build-arg APT_MIRROR="${RN_APT_MIRROR:-}" \
        --label "org.opencontainers.image.source=https://${GITHUB_REPO%.git}" \
        --label "org.opencontainers.image.revision=$SRC_SHA" \
        --label "org.opencontainers.image.version=$SRC_VERSION" \
        -t "$IMG:$SRC_VERSION" -t "$IMG:$SRC_SHA" -t "$IMG:$SRC_REF_SLUG" .
    - mkdir -p "$CI_PROJECT_DIR/images"
    - docker save "$IMG:$SRC_VERSION" "$IMG:$SRC_SHA" "$IMG:$SRC_REF_SLUG" | gzip -1 > "$CI_PROJECT_DIR/images/$COMPONENT.tar.gz"
  artifacts:
    name: "image-${COMPONENT}-${SRC_VERSION}"
    expire_in: 1 day
    paths: [images/]

build:api:
  extends: .build_image
  variables: { COMPONENT: api }

build:agent:
  extends: .build_image
  variables: { COMPONENT: agent }

# Сборка образа zapret сама прогоняет все стратегии через nfqws --dry-run.
build:zapret:
  extends: .build_image
  variables: { COMPONENT: zapret }

# == 4. Безопасность ===========================================================
.vck:
  stage: scan
  image: $ALPINE_IMAGE
  needs: ["fetch:source", "test:go"]
  variables:
    GIT_STRATEGY: none
  before_script:
    - apk add --no-cache ca-certificates curl >/dev/null
    - mkdir -p reports "$CI_PROJECT_DIR/bin"
    - |
      if [ -z "$VCK_URL" ] || [ -z "$VCK_TOKEN" ]; then
        echo "Не заданы VCK_URL или VCK_TOKEN (Settings → CI/CD → Variables; Protected видны только защищённым веткам)."
        exit 1
      fi
    # клиент раздаёт сама платформа; на неизвестный путь она отвечает страницей
    # интерфейса с кодом 200, поэтому проверяем, что пришёл ELF
    - |
      CA=""; [ -n "${VCK_CA_FILE:-}" ] && CA="--cacert $VCK_CA_FILE"
      curl -fsSL $CA -o "$CI_PROJECT_DIR/bin/vck" "${VCK_URL%/}/downloads/vck/linux-amd64"
      if ! head -c 4 "$CI_PROJECT_DIR/bin/vck" | grep -q ELF; then
        echo "С $VCK_URL/downloads/vck/linux-amd64 пришёл не исполняемый файл:"; head -c 300 "$CI_PROJECT_DIR/bin/vck"; exit 1
      fi
      chmod +x "$CI_PROJECT_DIR/bin/vck"
  after_script:
    - '[ -f reports/vck-report.md ] && cat reports/vck-report.md || echo "отчёт не сформирован"'
  artifacts:
    when: always
    expire_in: 30 days
    paths: [reports/]
    reports:
      junit: reports/vck-report.xml

scan:sast:
  extends: .vck
  script:
    - |
      "$CI_PROJECT_DIR/bin/vck" scan --root src --project "$VCK_PROJECT" --module sast \
        --branch "$GITHUB_REF" --commit "$SRC_SHA" --wait-for-gate \
        --format html,md,sarif,junit --output reports/

scan:sca:
  extends: .vck
  script:
    - |
      "$CI_PROJECT_DIR/bin/vck" scan --root src --project "$VCK_PROJECT" --module sca \
        --branch "$GITHUB_REF" --commit "$SRC_SHA" --wait-for-gate \
        --format html,md,sarif,junit --output reports/

# == 5. Публикация =============================================================
publish:images:
  stage: publish
  image:
    name: $SKOPEO_IMAGE
    entrypoint: [""]
  needs: ["fetch:source", "build:api", "build:agent", "build:zapret", "scan:sast", "scan:sca"]
  variables:
    GIT_STRATEGY: none
  before_script:
    - |
      if [ -z "$VC_REGISTRY_USER" ] || [ -z "$VC_REGISTRY_PASSWORD" ]; then
        echo "Не заданы VC_REGISTRY_USER / VC_REGISTRY_PASSWORD."; exit 1
      fi
    - CERTS=""; DEST_CERTS=""
    - |
      if [ -n "$VC_REGISTRY_CA" ] && [ -f "$VC_REGISTRY_CA" ]; then
        mkdir -p /tmp/registry-ca && cp "$VC_REGISTRY_CA" /tmp/registry-ca/ca.crt
        CERTS="--cert-dir /tmp/registry-ca"; DEST_CERTS="--dest-cert-dir /tmp/registry-ca"
      fi
    - echo "$VC_REGISTRY_PASSWORD" | skopeo login $CERTS -u "$VC_REGISTRY_USER" --password-stdin "$REGISTRY_HOST"
  script:
    - '[ -n "$SRC_SHA" ] && [ -n "$SRC_VERSION" ] || { echo "SRC_* пусты: fetch:source должен быть в needs"; exit 1; }'
    - TAGS="$SRC_VERSION $SRC_SHA $SRC_REF_SLUG"
    - if [ "$GITHUB_REF" = "main" ]; then TAGS="$TAGS latest"; fi
    - |
      for c in $COMPONENTS; do
        for t in $TAGS; do
          skopeo copy --retry-times 3 $DEST_CERTS \
            "docker-archive:images/$c.tar.gz:$IMAGE_BASE/$c:$SRC_VERSION" "docker://$IMAGE_BASE/$c:$t"
        done
      done
  after_script:
    - skopeo logout --all >/dev/null 2>&1 || true

# == 6. Пакет обновления =======================================================
package:bundle:
  stage: package
  image: docker:27
  services: ["docker:27-dind"]
  needs: ["fetch:source", "build:api", "build:agent", "build:zapret", "scan:sast", "scan:sca"]
  variables:
    GIT_STRATEGY: none
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - apk add --no-cache bash tar coreutils findutils sed >/dev/null
  script:
    - for c in $COMPONENTS; do docker load -i "images/$c.tar.gz"; done
    - cd src
    - |
      printf 'RN_GOPROXY=%s\nRN_NPM_REGISTRY=%s\nRN_APT_MIRROR=%s\n' "${RN_GOPROXY:-}" "${RN_NPM_REGISTRY:-}" "${RN_APT_MIRROR:-}" > mirrors.local.env
    - bash scripts/build-bundle.sh "$SRC_VERSION" --use-loaded "$IMAGE_BASE" --out "$CI_PROJECT_DIR/dist"
    - cat "$CI_PROJECT_DIR"/dist/*.sha256
  artifacts:
    name: "rendolnet-${SRC_VERSION}"
    expire_in: 90 days
    paths:
      - dist/*.rnu
      - dist/*.sha256
